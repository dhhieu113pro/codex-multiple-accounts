name: CI
on:
  push:
  pull_request:
jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore CodexMultipleAccounts.slnx
      - run: dotnet build CodexMultipleAccounts.slnx -c Release --no-restore
      - run: dotnet test CodexMultipleAccounts.slnx -c Release --no-build
